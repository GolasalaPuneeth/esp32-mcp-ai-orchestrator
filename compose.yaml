services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto_mqtt:/mosquitto

  db:
    image: postgres:18
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
      POSTGRES_DB: feedback_database

    ports:
      - "5432:5432"

    volumes:
      - ./postgres:/var/lib/postgresql

    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feedback_database"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

    environment:
      MP_SMTP_RELAY_HOST: smtp.gmail.com
      MP_SMTP_RELAY_PORT: 587
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_AUTH: login
      MP_SMTP_RELAY_USERNAME: ${GMAIL_USERNAME}
      MP_SMTP_RELAY_PASSWORD: ${GMAIL_APP_PASSWORD}
  

  fastmcp_app:
    build: ./app_backend
    ports:
      - "8003:8003"
    volumes:
      - ./app_backend:/app

  fastmcp_inspector:
    build:
      context: ./app_backend
      dockerfile: Dockerfile.inspector
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6275:6275"
    volumes:
      - ./app_backend:/app
    environment:
      HOST: 0.0.0.0
      DANGEROUSLY_BIND_ALL_INTERFACES: "true"
      MCP_INSPECTOR_SECRET_STORE: memory